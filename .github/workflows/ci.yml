name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (ESLint)
        run: npx eslint . --ext .ts,.tsx

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npx vitest run

  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint (ESLint)
        run: npx eslint src

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npx vitest run
